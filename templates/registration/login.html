{% extends "base.html" %}

{% block title %}Log in{% endblock %}

{% block content %}
<div class="flex justify-center mt-16">
  <div class="card bg-base-100 shadow w-full max-w-sm">
    <div class="card-body">
      <h1 class="card-title text-2xl">Applicant Tracking</h1>
      <p class="text-sm opacity-70">Staff login</p>

      {% if form.non_field_errors %}
        <div role="alert" class="alert alert-error">
          {% for error in form.non_field_errors %}<span>{{ error }}</span>{% endfor %}
        </div>
      {% endif %}

      <form method="post" class="flex flex-col gap-3">
        {% csrf_token %}
        <label class="flex flex-col gap-1 w-full">
          <span class="text-sm font-medium">Username</span>
          <input type="text" name="username" class="input w-full" autofocus required value="{{ form.username.value|default:'' }}">
        </label>
        <label class="flex flex-col gap-1 w-full">
          <span class="text-sm font-medium">Password</span>
          <input type="password" name="password" class="input w-full" required>
        </label>
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit" class="btn btn-primary mt-2">Log in</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
